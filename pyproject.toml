[project]
name = "astra"
version = "0.2.0"
description = "A general-purpose, storage/framework-agnostic agent harness."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
# Optional extras — the core (astra.tools.core/handlers/executor/process,
# astra.concurrency, astra.sessions, astra.quota, astra.context) has NO
# dependency beyond `openai`. Each extra below unlocks one additional
# capability and is only imported when you actually use it.
jsonschema = ["jsonschema>=4.18.0"]   # full JSON Schema validation for tool arguments
yaml = ["pyyaml>=6.0"]                # tool.yaml manifests (tool.json needs nothing extra)
mcp = ["mcp>=1.0.0"]                  # McpSource — register any MCP server's tools
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]                                      # execute_tool/chat spans (astra.telemetry)
redis = ["redis>=5.0.0"]              # RedisSignalStore — cross-process Stop + session lock
postgres = ["asyncpg>=0.29.0"]        # examples/postgres_store.py
all = [
    "astra[jsonschema,yaml,mcp,otel,redis,api]",
]

[tool.setuptools.packages.find]
include = ["astra*"]
